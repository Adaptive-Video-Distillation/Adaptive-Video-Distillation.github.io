<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive-Video-Distillation | CVPR 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ── reset & custom properties ─────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --accent:#6C63FF;
  --accent2:#00BFA6;
  --accent3:#FF6584;
  --text:#e8e8f0;
  --text-dim:#9a9ab0;
  --bg:#08080c;
  --card:rgba(255,255,255,.04);
  --card-border:rgba(255,255,255,.07);
  --glow:rgba(108,99,255,.12);
  --radius:18px;
}

/* ── global ──────────────────────────────────────────────── */
html{scroll-behavior:smooth}

body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.75;
  overflow-x:hidden;
}

::selection{background:var(--accent);color:#fff}

/* ── animated background ──────────────────────────────────── */
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.02) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 100%);
}

/* floating orbs */
.orb{
  position:fixed;border-radius:50%;filter:blur(100px);opacity:.18;
  pointer-events:none;z-index:0;
  animation:orbFloat 20s ease-in-out infinite alternate;
}
.orb--1{width:600px;height:600px;background:var(--accent);top:-10%;left:-10%;animation-delay:0s}
.orb--2{width:500px;height:500px;background:var(--accent2);bottom:-15%;right:-10%;animation-delay:-7s}
.orb--3{width:400px;height:400px;background:var(--accent3);top:40%;left:55%;animation-delay:-14s;opacity:.1}

@keyframes orbFloat{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(40px,-60px) scale(1.15)}
  100%{transform:translate(-30px,50px) scale(.95)}
}

/* ── container ────────────────────────────────────────────── */
.container{
  position:relative;z-index:1;
  max-width:960px;margin:auto;
  padding:100px 24px 60px;
}

/* ── hero ─────────────────────────────────────────────────── */
.hero{text-align:center;padding:60px 0 20px}

.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 16px;border-radius:999px;
  font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  background:linear-gradient(135deg,rgba(108,99,255,.15),rgba(0,191,166,.15));
  border:1px solid rgba(108,99,255,.25);
  color:var(--accent);
  margin-bottom:28px;
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

h1{
  font-size:clamp(32px,5.5vw,56px);
  font-weight:900;
  line-height:1.15;
  letter-spacing:-.02em;
  background:linear-gradient(135deg,#fff 0%,#6C63FF 40%,#00BFA6 70%,#FF6584 100%);
  background-size:200% 200%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:gradShift 8s ease infinite;
  padding-bottom:4px;
}

@keyframes gradShift{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.subtitle{
  margin-top:20px;font-size:17px;color:var(--text-dim);
  max-width:640px;margin-inline:auto;
}

/* ── authors ──────────────────────────────────────────────── */
.authors{
  text-align:center;margin-top:36px;font-size:16px;color:var(--text-dim);
  line-height:2;
}
.authors strong{color:var(--text);font-weight:600}
.authors sup{font-size:10px;color:var(--accent)}

.affiliations{
  margin-top:14px;
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px 28px;
  font-size:13px;color:var(--text-dim);
}
.affiliations span{display:inline-flex;align-items:center;gap:4px}

.note{
  text-align:center;font-size:13px;color:var(--text-dim);
  margin-top:10px;opacity:.7;line-height:1.8;
}

.venue-tag{
  display:inline-block;
  margin-top:20px;
  padding:8px 22px;border-radius:10px;
  font-weight:700;font-size:15px;letter-spacing:.5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  box-shadow:0 4px 30px rgba(108,99,255,.3);
}

/* ── links ────────────────────────────────────────────────── */
.links{
  display:flex;justify-content:center;flex-wrap:wrap;gap:12px;
  margin-top:32px;
}

.links a{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 24px;border-radius:12px;
  background:var(--card);
  border:1px solid var(--card-border);
  text-decoration:none;
  color:var(--text);font-weight:600;font-size:15px;
  backdrop-filter:blur(12px);
  transition:.3s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.links a::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  opacity:0;transition:opacity .3s;
  z-index:0;
}
.links a:hover::before{opacity:1}
.links a:hover{
  border-color:transparent;
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(108,99,255,.25);
  color:#fff;
}
.links a svg,.links a span{position:relative;z-index:1}

/* ── sections ─────────────────────────────────────────────── */
.section{margin-top:100px}

.section-label{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--accent);margin-bottom:12px;
}
.section-label .line{width:24px;height:2px;background:var(--accent);border-radius:2px}

.section h2{
  font-size:clamp(26px,4vw,36px);
  font-weight:800;
  letter-spacing:-.01em;
  margin-bottom:24px;
}

/* ── cards ─────────────────────────────────────────────────── */
.card{
  background:var(--card);
  border:1px solid var(--card-border);
  padding:36px;
  border-radius:var(--radius);
  backdrop-filter:blur(20px);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(108,99,255,.4),transparent);
}

.card p{
  color:var(--text-dim);
  font-size:15px;
  line-height:1.85;
}

/* ── media ────────────────────────────────────────────────── */
img{
  width:100%;border-radius:14px;
  margin-top:24px;
  border:1px solid var(--card-border);
}

video{
  width:100%;border-radius:14px;
  margin-top:24px;
  border:1px solid var(--card-border);
}

/* video glow wrapper */
.video-wrap{
  position:relative;
  margin-top:24px;
}
.video-wrap::after{
  content:'';position:absolute;
  inset:20px -20px -20px -20px;
  background:linear-gradient(135deg,rgba(108,99,255,.15),rgba(0,191,166,.08));
  filter:blur(40px);border-radius:30px;
  z-index:-1;
}
.video-wrap video{margin-top:0}

/* ── bibtex ───────────────────────────────────────────────── */
.bibtex-wrap{position:relative}
.bibtex-wrap pre{
  margin:0;padding:24px;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;line-height:1.7;
  color:var(--text-dim);
  overflow-x:auto;
  white-space:pre-wrap;
  word-break:break-all;
}
.copy-btn{
  position:absolute;top:14px;right:14px;
  padding:6px 14px;border-radius:8px;border:1px solid var(--card-border);
  background:rgba(255,255,255,.05);
  color:var(--text-dim);
  font-size:12px;font-weight:600;cursor:pointer;
  transition:.2s;
}
.copy-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── key idea pills ───────────────────────────────────────── */
.pills{
  display:flex;flex-wrap:wrap;gap:10px;
  margin-top:18px;
}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:10px;
  font-size:13px;font-weight:600;
  border:1px solid var(--card-border);
  background:rgba(255,255,255,.03);
  color:var(--text);
}
.pill .icon{font-size:16px}

/* ── divider ──────────────────────────────────────────────── */
.divider{
  height:1px;margin:80px 0;
  background:linear-gradient(90deg,transparent,var(--card-border),transparent);
}

/* ── footer ───────────────────────────────────────────────── */
footer{
  text-align:center;
  margin-top:120px;
  padding:40px 0 30px;
  font-size:13px;
  color:var(--text-dim);
  opacity:.5;
  border-top:1px solid var(--card-border);
}

/* ── scroll animations ────────────────────────────────────── */
.fade-in{
  opacity:0;
  transform:translateY(30px);
  transition:opacity .8s cubic-bezier(.4,0,.2,1), transform .8s cubic-bezier(.4,0,.2,1);
}
.fade-in.visible{
  opacity:1;
  transform:translateY(0);
}

/* stagger children */
.stagger > *{
  opacity:0;transform:translateY(20px);
  transition:opacity .6s ease, transform .6s ease;
}
.stagger.visible > *:nth-child(1){transition-delay:.05s}
.stagger.visible > *:nth-child(2){transition-delay:.12s}
.stagger.visible > *:nth-child(3){transition-delay:.19s}
.stagger.visible > *:nth-child(4){transition-delay:.26s}
.stagger.visible > *:nth-child(5){transition-delay:.33s}
.stagger.visible > *{opacity:1;transform:translateY(0)}

/* ── responsive ───────────────────────────────────────────── */
@media(max-width:640px){
  .container{padding:60px 16px 40px}
  .card{padding:24px 18px}
  .hero{padding:30px 0 10px}
  .section{margin-top:70px}
}

/* ── smooth scrollbar (webkit) ───────────────────────────── */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}

/* ── number steps ─────────────────────────────────────────── */
.steps{
  counter-reset:step;
  list-style:none;padding:0;margin-top:20px;
}
.steps li{
  counter-increment:step;
  position:relative;
  padding-left:48px;
  margin-bottom:20px;
  color:var(--text-dim);
  font-size:15px;
  line-height:1.8;
}
.steps li::before{
  content:counter(step);
  position:absolute;left:0;top:2px;
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;
  font-size:14px;font-weight:700;
  background:linear-gradient(135deg,rgba(108,99,255,.2),rgba(0,191,166,.15));
  border:1px solid rgba(108,99,255,.3);
  color:var(--accent);
}

/* particle canvas */
#particles{
  position:fixed;inset:0;z-index:0;pointer-events:none;
}
</style>

</head>
